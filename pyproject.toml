[project]
name = "ai-chatbot-platform"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "python-jose[cryptography]>=3.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "motor>=3.3.2",
    "pymongo>=4.6.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "email-validator>=2.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1"
]

[tool.vercel]
entrypoint = "backend.main:app"