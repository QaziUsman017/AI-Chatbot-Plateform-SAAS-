<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI Chatbot Platform</title>

  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/chatbot.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/responsive.css" />

  <style>
    /* ==================================================
       AUTH SCREEN
       ================================================== */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background: #0b0d0c;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border-radius: 20px;
      background: #111513;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: #10b981;
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
    }

    .auth-brand h1 {
      margin: 0;
      color: #f5f7f6;
      font-size: 26px;
      font-weight: 700;
    }

    .auth-brand p {
      margin: 8px 0 0;
      color: #929b97;
      font-size: 14px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      padding: 5px;
      border-radius: 12px;
      background: #0b0d0c;
    }

    .auth-tab {
      flex: 1;
      border: 0;
      padding: 11px 15px;
      border-radius: 8px;
      background: transparent;
      color: #929b97;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .auth-tab:hover {
      color: #f5f7f6;
    }

    .auth-tab.active {
      background: #10b981;
      color: #ffffff;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .auth-form-group {
      margin-bottom: 17px;
    }

    .auth-form-group label {
      display: block;
      margin-bottom: 7px;
      color: #d8dedb;
      font-size: 14px;
      font-weight: 600;
    }

    .auth-form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 10px;
      outline: none;
      background: #161a18;
      color: #f5f7f6;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .auth-form-group input::placeholder {
      color: #68716d;
    }

    .auth-form-group input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
    }

    .auth-submit {
      width: 100%;
      margin-top: 5px;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: #10b981;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .auth-submit:hover {
      filter: brightness(1.08);
    }

    .auth-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .auth-message {
      display: none;
      margin-bottom: 17px;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .auth-message.show {
      display: block;
    }

    .auth-message.error {
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    .auth-message.success {
      background: rgba(34, 197, 94, 0.10);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #86efac;
    }

    .auth-switch {
      margin-top: 20px;
      text-align: center;
      color: #929b97;
      font-size: 13px;
    }

    .auth-switch button {
      padding: 0;
      border: 0;
      background: transparent;
      color: #10b981;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .auth-switch button:hover {
      text-decoration: underline;
    }

    .auth-client-field {
      display: none;
    }

    /* ==================================================
       RESPONSIVE AUTH
       ================================================== */

    @media (max-width: 520px) {
      .auth-screen {
        padding: 20px 14px;
      }

      .auth-card {
        padding: 24px 20px;
        border-radius: 16px;
      }

      .auth-brand h1 {
        font-size: 23px;
      }
    }

    /* ==================================================
       APP VISIBILITY
       ================================================== */

    #app-shell {
      display: none;
    }

    #auth-screen {
      display: flex;
    }
  </style>
</head>


<body>

  <!-- ==================================================
       AUTH SCREEN
       ================================================== -->

  <section
    class="auth-screen"
    id="auth-screen"
  >

    <div class="auth-card">

      <!-- BRAND -->

      <div class="auth-brand">

        <div class="auth-brand-icon">
          AI
        </div>

        <h1>
          AI Chatbot Platform
        </h1>

        <p>
          Sign in to continue or create a new account.
        </p>

      </div>


      <!-- ==================================================
           AUTH TABS
           ================================================== -->

      <div class="auth-tabs">

        <button
          type="button"
          class="auth-tab active"
          id="login-tab"
        >
          Login
        </button>

        <button
          type="button"
          class="auth-tab"
          id="register-tab"
        >
          Register
        </button>

      </div>


      <!-- ==================================================
           AUTH MESSAGE
           ================================================== -->

      <div
        class="auth-message"
        id="auth-message"
        role="alert"
      ></div>


      <!-- ==================================================
           LOGIN FORM
           ================================================== -->

      <form
        class="auth-form active"
        id="login-form"
      >

        <div class="auth-form-group">

          <label for="login-email">
            Email
          </label>

          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />

        </div>


        <div class="auth-form-group">

          <label for="login-password">
            Password
          </label>

          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

        </div>


        <button
          type="submit"
          class="auth-submit"
          id="login-submit"
        >
          Login
        </button>

      </form>


      <!-- ==================================================
           REGISTER FORM
           ================================================== -->

      <form
        class="auth-form"
        id="register-form"
      >

        <div class="auth-form-group">

          <label for="register-name">
            Full Name
          </label>

          <input
            type="text"
            id="register-name"
            name="full_name"
            placeholder="Enter your full name"
            autocomplete="name"
            minlength="2"
            maxlength="100"
            required
          />

        </div>


        <div class="auth-form-group">

          <label for="register-email">
            Email
          </label>

          <input
            type="email"
            id="register-email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />

        </div>


        <div class="auth-form-group">

          <label for="register-password">
            Password
          </label>

          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="Minimum 8 characters"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            required
          />

        </div>


        <!-- Optional Client ID -->

        <div class="auth-form-group auth-client-field">

          <label for="register-client-id">
            Client ID
          </label>

          <input
            type="text"
            id="register-client-id"
            name="client_id"
            placeholder="Optional client ID"
            maxlength="128"
          />

        </div>


        <button
          type="submit"
          class="auth-submit"
          id="register-submit"
        >
          Create Account
        </button>

      </form>


      <!-- ==================================================
           SWITCH TEXT
           ================================================== -->

      <div class="auth-switch">

        <span id="auth-switch-text">
          Don't have an account?
        </span>

        <button
          type="button"
          id="auth-switch-button"
        >
          Register
        </button>

      </div>

    </div>

  </section>


  <!-- ==================================================
       MAIN CHAT APPLICATION
       ================================================== -->

  <main
    class="app-shell"
    id="app-shell"
  >


    <!-- ==================================================
         TOP BAR
         ================================================== -->

    <header class="topbar">

      <h1>
        AI Chatbot Platform
      </h1>

    </header>


    <!-- ==================================================
         CHAT HISTORY
         ================================================== -->

    <aside
      class="chat-history"
      id="chat-history"
      aria-label="Previous Chats"
    >

      <h3>
        Previous Chats
      </h3>


      <div
        class="chat-history-list"
        id="chat-history-list"
      >

        <p class="chat-history-empty">
          No previous chats
        </p>

      </div>

    </aside>


    <!-- ==================================================
         CHAT PANEL
         ================================================== -->

    <section
      class="chat-panel"
      id="chat-panel"
      aria-label="AI Chatbot"
    >


      <!-- ==================================================
           CHAT HEADER
           ================================================== -->

      <header class="chat-header">

        <div class="chat-header-info">

          <div class="chat-avatar">
            AI
          </div>


          <div class="chat-header-text">

            <h2>
              AI Assistant
            </h2>

            <span class="chat-status">
              Online
            </span>

          </div>

        </div>


        <!-- HEADER ACTIONS -->

        <div class="chat-header-actions">

          <button
            type="button"
            class="new-chat-button"
            id="new-chat-button"
            aria-label="Start a new chat"
          >
            New Chat
          </button>


          <button
            type="button"
            class="minimize-button"
            id="minimize-button"
            aria-label="Minimize chat"
            title="Minimize"
          >
            −
          </button>


          <button
            type="button"
            class="close-button"
            id="close-button"
            aria-label="Close chat"
            title="Close"
          >
            ×
          </button>

        </div>

      </header>


      <!-- ==================================================
           CHAT WINDOW
           ================================================== -->

      <div
        class="chat-window"
        id="chat-window"
      >

        <!-- WELCOME SCREEN -->

        <div
          class="welcome-screen"
          id="welcome-screen"
        >

          <div class="welcome-icon">
            AI
          </div>

          <h3>
            How can I help you?
          </h3>

          <p>
            Ask me anything and I'll do my best to help you.
          </p>


          <!-- SUGGESTIONS -->

          <div class="suggestion-list">

            <button
              type="button"
              class="suggestion"
              data-message="Tell me about artificial intelligence"
            >
              Tell me about AI
            </button>


            <button
              type="button"
              class="suggestion"
              data-message="Explain machine learning"
            >
              Explain machine learning
            </button>


            <button
              type="button"
              class="suggestion"
              data-message="Help me with programming"
            >
              Help me with programming
            </button>

          </div>

        </div>


        <!-- TYPING INDICATOR -->

        <div
          class="typing-indicator"
          id="typing-indicator"
        >

          <span></span>
          <span></span>
          <span></span>

        </div>

      </div>


      <!-- ==================================================
           MESSAGE COMPOSER
           ================================================== -->

      <form
        class="composer"
        id="chat-form"
      >

        <input
          type="text"
          id="message-input"
          placeholder="Type your message..."
          autocomplete="off"
        />


        <button
          type="submit"
          id="send-button"
        >
          Send
        </button>

      </form>

    </section>

  </main>


  <!-- ==================================================
       FLOATING CHAT BUTTON
       ================================================== -->

  <button
    type="button"
    class="chat-toggle"
    id="chat-toggle"
    aria-label="Open chat"
  >
    💬
  </button>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/chatbot.js"></script>


  <!-- ==================================================
       AUTHENTICATION JAVASCRIPT
       ================================================== -->

  <script>

    /* ==================================================
       API BASE URL
       ================================================== */

    const AUTH_API_BASE =
      (window.chatbotConfig && window.chatbotConfig.apiBaseUrl)
        ? window.chatbotConfig.apiBaseUrl
        : "";


    /* ==================================================
       ELEMENTS
       ================================================== */

    const authScreen =
      document.getElementById("auth-screen");

    const appShell =
      document.getElementById("app-shell");

    const loginTab =
      document.getElementById("login-tab");

    const registerTab =
      document.getElementById("register-tab");

    const loginForm =
      document.getElementById("login-form");

    const registerForm =
      document.getElementById("register-form");

    const authMessage =
      document.getElementById("auth-message");

    const authSwitchText =
      document.getElementById("auth-switch-text");

    const authSwitchButton =
      document.getElementById("auth-switch-button");

    const loginSubmit =
      document.getElementById("login-submit");

    const registerSubmit =
      document.getElementById("register-submit");


    /* ==================================================
       TOKEN HELPERS
       ================================================== */

    function getStoredToken() {

      return (
        localStorage.getItem("access_token") ||
        localStorage.getItem("accessToken") ||
        localStorage.getItem("token") ||
        ""
      );

    }


    function saveAuthData(data) {

      if (!data || !data.access_token) {
        throw new Error("Authentication token was not returned by the server.");
      }

      localStorage.setItem(
        "access_token",
        data.access_token
      );

      localStorage.setItem(
        "accessToken",
        data.access_token
      );

      localStorage.setItem(
        "token",
        data.access_token
      );


      /* Save useful user information */

      const user = {
        user_id: data.user_id || "",
        email: data.email || "",
        role: data.role || "",
        client_id: data.client_id || null
      };

      localStorage.setItem(
        "user",
        JSON.stringify(user)
      );

    }


    /* ==================================================
       AUTH MESSAGE
       ================================================== */

    function showAuthMessage(
      message,
      type = "error"
    ) {

      authMessage.textContent = message;

      authMessage.className =
        "auth-message show " + type;

    }


    function clearAuthMessage() {

      authMessage.textContent = "";

      authMessage.className =
        "auth-message";

    }


    /* ==================================================
       API ERROR HANDLER
       ================================================== */

    async function getApiError(response) {

      try {

        const data =
          await response.json();

        if (typeof data.detail === "string") {
          return data.detail;
        }

        if (Array.isArray(data.detail)) {

          return data.detail
            .map(item => item.msg || "Invalid input")
            .join(", ");

        }

        if (data.message) {
          return data.message;
        }

      } catch (error) {
        /* Ignore JSON parsing errors */
      }

      return `Request failed with status ${response.status}.`;

    }


    /* ==================================================
       SWITCH AUTH MODE
       ================================================== */

    function showLogin() {

      clearAuthMessage();

      loginTab.classList.add("active");
      registerTab.classList.remove("active");

      loginForm.classList.add("active");
      registerForm.classList.remove("active");

      authSwitchText.textContent =
        "Don't have an account?";

      authSwitchButton.textContent =
        "Register";

      document
        .getElementById("login-email")
        .focus();

    }


    function showRegister() {

      clearAuthMessage();

      registerTab.classList.add("active");
      loginTab.classList.remove("active");

      registerForm.classList.add("active");
      loginForm.classList.remove("active");

      authSwitchText.textContent =
        "Already have an account?";

      authSwitchButton.textContent =
        "Login";

      document
        .getElementById("register-name")
        .focus();

    }


    loginTab.addEventListener(
      "click",
      showLogin
    );


    registerTab.addEventListener(
      "click",
      showRegister
    );


    authSwitchButton.addEventListener(
      "click",
      () => {

        if (registerForm.classList.contains("active")) {
          showLogin();
        } else {
          showRegister();
        }

      }
    );


    /* ==================================================
       REDIRECT TO DASHBOARD
       ================================================== */

    function redirectToDashboard() {

      window.location.href =
        "/dashboard/";

    }


    /* ==================================================
       LOGIN
       ================================================== */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearAuthMessage();

        const email =
          document
            .getElementById("login-email")
            .value
            .trim();

        const password =
          document
            .getElementById("login-password")
            .value;


        if (!email || !password) {

          showAuthMessage(
            "Please enter your email and password."
          );

          return;

        }


        loginSubmit.disabled = true;

        loginSubmit.textContent =
          "Logging in...";


        try {

          const response =
            await fetch(
              `${AUTH_API_BASE}/auth/login`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email: email,
                  password: password
                })
              }
            );


          if (!response.ok) {

            const errorMessage =
              await getApiError(response);

            throw new Error(
              errorMessage
            );

          }


          const data =
            await response.json();


          saveAuthData(data);


          showAuthMessage(
            "Login successful. Redirecting...",
            "success"
          );


          setTimeout(
            redirectToDashboard,
            400
          );

        } catch (error) {

          console.error(
            "Login error:",
            error
          );

          showAuthMessage(
            error.message ||
            "Login failed. Please try again."
          );

        } finally {

          loginSubmit.disabled = false;

          loginSubmit.textContent =
            "Login";

        }

      }
    );


    /* ==================================================
       REGISTER
       ================================================== */

    registerForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearAuthMessage();


        const fullName =
          document
            .getElementById("register-name")
            .value
            .trim();

        const email =
          document
            .getElementById("register-email")
            .value
            .trim();

        const password =
          document
            .getElementById("register-password")
            .value;

        const clientId =
          document
            .getElementById("register-client-id")
            .value
            .trim();


        if (fullName.length < 2) {

          showAuthMessage(
            "Full name must be at least 2 characters."
          );

          return;

        }


        if (password.length < 8) {

          showAuthMessage(
            "Password must be at least 8 characters."
          );

          return;

        }


        registerSubmit.disabled = true;

        registerSubmit.textContent =
          "Creating account...";


        try {

          const requestBody = {
            email: email,
            password: password,
            full_name: fullName
          };


          if (clientId) {
            requestBody.client_id =
              clientId;
          }


          const response =
            await fetch(
              `${AUTH_API_BASE}/auth/register`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(requestBody)
              }
            );


          if (!response.ok) {

            const errorMessage =
              await getApiError(response);

            throw new Error(
              errorMessage
            );

          }


          const data =
            await response.json();


          saveAuthData(data);


          showAuthMessage(
            "Account created successfully. Redirecting...",
            "success"
          );


          setTimeout(
            redirectToDashboard,
            400
          );

        } catch (error) {

          console.error(
            "Registration error:",
            error
          );

          showAuthMessage(
            error.message ||
            "Registration failed. Please try again."
          );

        } finally {

          registerSubmit.disabled = false;

          registerSubmit.textContent =
            "Create Account";

        }

      }
    );


    /* ==================================================
       INITIAL AUTH STATE
       ================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const token =
          getStoredToken();


        /*
         * If token already exists,
         * user can go directly to dashboard.
         */

        if (token) {

          redirectToDashboard();

          return;

        }


        /*
         * Otherwise show login/register.
         */

        authScreen.style.display =
          "flex";

        appShell.style.display =
          "none";

      }
    );

  </script>

</body>

</html>
