<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - AI Chatbot Platform</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-page {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            width: 100%;
            background: #ffffff;
            border: 1px solid #e6e9ef;
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
            line-height: 1.25;
            color: #111827;
        }

        .brand p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .optional {
            color: #9ca3af;
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #d8dde7;
            border-radius: 10px;
            outline: none;
            background: #ffffff;
            color: #111827;
            font-size: 15px;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .password-input {
            padding-right: 74px;
        }

        .form-input:focus {
            border-color: #111827;
            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #6b7280;
            cursor: pointer;
            padding: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .password-toggle:hover {
            color: #111827;
        }

        .field-help {
            margin-top: 6px;
            font-size: 12px;
            color: #8a93a3;
        }

        .submit-button {
            width: 100%;
            height: 48px;
            margin-top: 5px;
            border: 0;
            border-radius: 10px;
            background: #111827;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition:
                transform 0.15s ease,
                opacity 0.2s ease;
        }

        .submit-button:hover {
            transform: translateY(-1px);
        }

        .submit-button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
        }

        .auth-message {
            display: none;
            margin: 16px 0 0;
            padding: 11px 13px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.45;
        }

        .auth-message.error {
            display: block;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        .auth-message.success {
            display: block;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        .auth-footer a {
            color: #111827;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .loading-text {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 14px;
            }

            .auth-card {
                padding: 26px 20px;
                border-radius: 15px;
            }

            .brand h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            <div class="brand-logo">AI</div>

            <h1>Create Account</h1>

            <p>
                Start using your AI Chatbot Platform
            </p>
        </div>

        <form id="register-form" novalidate>

            <div class="form-group">
                <label for="full-name">
                    Full Name
                </label>

                <input
                    id="full-name"
                    class="form-input"
                    type="text"
                    name="full_name"
                    autocomplete="name"
                    placeholder="Enter your full name"
                    minlength="2"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    class="form-input"
                    type="email"
                    name="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        id="password"
                        class="form-input password-input"
                        type="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        id="toggle-password"
                        class="password-toggle"
                    >
                        Show
                    </button>

                </div>

                <div class="field-help">
                    Password must contain at least 8 characters.
                </div>
            </div>

            <div class="form-group">
                <label for="client-id">
                    Client ID
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    id="client-id"
                    class="form-input"
                    type="text"
                    name="client_id"
                    autocomplete="off"
                    placeholder="e.g. client_001"
                >
            </div>

            <button
                id="register-button"
                class="submit-button"
                type="submit"
            >
                Create Account
            </button>

            <div
                id="auth-message"
                class="auth-message"
                role="alert"
            ></div>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="./login.html">Login</a>
        </div>

    </div>

</div>

<script src="./js/config.js"></script>
<script src="./js/auth.js"></script>

<script>
    "use strict";

    const form = document.getElementById("register-form");

    const fullNameInput =
        document.getElementById("full-name");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const clientIdInput =
        document.getElementById("client-id");

    const registerButton =
        document.getElementById("register-button");

    const messageBox =
        document.getElementById("auth-message");

    const togglePassword =
        document.getElementById("toggle-password");

    function showMessage(message, type = "error") {
        messageBox.textContent = message;
        messageBox.className = `auth-message ${type}`;
    }

    function clearMessage() {
        messageBox.textContent = "";
        messageBox.className = "auth-message";
    }

    function setLoading(loading) {
        registerButton.disabled = loading;

        if (loading) {
            registerButton.innerHTML = `
                <span class="loading-text">
                    <span class="spinner"></span>
                    Creating account...
                </span>
            `;
        } else {
            registerButton.textContent = "Create Account";
        }
    }

    togglePassword.addEventListener("click", function () {
        const isPassword =
            passwordInput.type === "password";

        passwordInput.type =
            isPassword ? "text" : "password";

        togglePassword.textContent =
            isPassword ? "Hide" : "Show";
    });

    // If an already-valid session exists, go directly to dashboard.
    (async function checkExistingSession() {
        if (!window.auth || !window.auth.getAccessToken()) {
            return;
        }

        const user = await window.auth.getCurrentUser();

        if (user) {
            window.location.replace("../dashboard/index.html");
        }
    })();

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        clearMessage();

        const fullName =
            fullNameInput.value.trim();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const clientId =
            clientIdInput.value.trim();

        if (!fullName) {
            showMessage("Please enter your full name.");
            fullNameInput.focus();
            return;
        }

        if (fullName.length < 2) {
            showMessage(
                "Full name must contain at least 2 characters."
            );
            fullNameInput.focus();
            return;
        }

        if (!email) {
            showMessage("Please enter your email address.");
            emailInput.focus();
            return;
        }

        if (!password) {
            showMessage("Please create a password.");
            passwordInput.focus();
            return;
        }

        if (password.length < 8) {
            showMessage(
                "Password must be at least 8 characters."
            );
            passwordInput.focus();
            return;
        }

        setLoading(true);

        try {
            const result = await window.registerUser(
                fullName,
                email,
                password,
                clientId || null
            );

            if (!result?.access_token) {
                throw new Error(
                    "Registration succeeded but no authentication token was received."
                );
            }

            showMessage(
                "Account created successfully. Opening dashboard...",
                "success"
            );

            setTimeout(() => {
                window.location.replace(
                    "../dashboard/index.html"
                );
            }, 250);

        } catch (error) {
            console.error(
                "Registration failed:",
                error
            );

            showMessage(
                error?.message ||
                "Registration failed. Please try again."
            );

            setLoading(false);
        }
    });
</script>

</body>
</html>
